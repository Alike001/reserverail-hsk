[profile.default]
src = "src"
out = "out"
libs = []
solc = "0.8.30"
optimizer = true
optimizer_runs = 200

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = true
show_metrics = true

[profile.fork]
test = "fork"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
